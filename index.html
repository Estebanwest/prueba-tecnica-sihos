<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pacientes - SIHOS</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilos Personalizados CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Navegación Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">SIHOS | Sistema Hospitalario</a>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row mb-3">
            <div class="col-12 text-center">
                <h2 class="fw-bold text-dark">Gestión de Pacientes</h2>
                <p class="text-muted">Módulo de registro y consulta de la API RESTful</p>
            </div>
        </div>

        <!-- Contenedor para mensajes de alerta -->
        <div id="alertMessage" class="alert d-none shadow-sm" role="alert"></div>

        <div class="row">
            <!-- Formulario de Registro (POST) -->
            <div class="col-lg-5 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">Registrar Nuevo Paciente</h5>
                    </div>
                    <div class="card-body p-4">
                        <form id="patientForm">
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-semibold">Nombre Completo *</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Ej. Juan Pérez" required>
                            </div>
                            <div class="mb-3">
                                <label for="documento" class="form-label fw-semibold">Documento de Identidad *</label>
                                <input type="text" class="form-control" id="documento" placeholder="Ej. 10102030" required>
                            </div>
                            <div class="mb-3">
                                <label for="correo" class="form-label fw-semibold">Correo Electrónico *</label>
                                <input type="email" class="form-control" id="correo" placeholder="ejemplo@correo.com" required>
                            </div>
                            <div class="mb-3">
                                <label for="telefono" class="form-label fw-semibold">Teléfono</label>
                                <input type="text" class="form-control" id="telefono" placeholder="Ej. 3001234567">
                            </div>
                            <div class="mb-3">
                                <label for="fecha_nacimiento" class="form-label fw-semibold">Fecha de Nacimiento</label>
                                <input type="date" class="form-control" id="fecha_nacimiento">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Guardar Paciente</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Listado de Pacientes (GET) -->
            <div class="col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="card-title mb-0">Listado de Pacientes Registrados</h5>
                    </div>
                    <div class="card-body p-4">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Documento</th>
                                        <th>Nombre</th>
                                        <th>Correo</th>
                                        <th class="text-center">Acción</th>
                                    </tr>
                                </thead>
                                <tbody id="patientsTableBody">
                                    <!-- Los registros se cargan dinámicamente mediante app.js -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de interacción JS -->
    <script src="app.js"></script>
</body>
</html>
